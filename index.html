.table th,

button {

/* =========================

</style>
</head>

<script>


/* =========================
   ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
========================= */

function number(id) {

    const value =
        parseFloat(
            document.getElementById(id).value
        );

    return isNaN(value)
        ? 0
        : value;
}


function value(id) {

    return document
        .getElementById(id)
        .value || '';
}


function money(numberValue) {

    return Number(numberValue)
        .toLocaleString('ru-RU') + ' ₽';
}


/* =========================
   РАСЧЁТЫ
========================= */

function calculate() {


    const cash =
        number('cashPayments');


    const card =
        number('cardPayments');


    const other =
        number('otherPayments');


    const salary =
        number('salary');


    const supplier1 =
        number('supplier1');


    const supplier2 =
        number('supplier2');


    const supplier3 =
        number('supplier3');


    const supplier4 =
        number('supplier4');


    const withdraw =
        number('withdraw');


    const totalPayments =
        cash +
        card +
        other;


    const totalExpenses =
        salary +
        supplier1 +
        supplier2 +
        supplier3 +
        supplier4 +
        withdraw;


    document.getElementById(
        'totalPayments'
    ).textContent =
        money(totalPayments);


    document.getElementById(
        'totalExpenses'
    ).textContent =
        money(totalExpenses);

}


/* =========================
   СОЗДАНИЕ ОТЧЁТА
========================= */

function createReport() {


    calculate();


    const date =
        value('date');


    const barista =
        value('barista');


    const openTime =
        value('openTime');


    const openCash =
        number('openCash');


    const closeTime =
        value('closeTime');


    const closeCash =
        number('closeCash');


    const cash =
        number('cashPayments');


    const card =
        number('cardPayments');


    const other =
        number('otherPayments');


    const salary =
        number('salary');


    const supplier1 =
        number('supplier1');


    const supplier2 =
        number('supplier2');


    const supplier3 =
        number('supplier3');


    const supplier4 =
        number('supplier4');


    const withdraw =
        number('withdraw');


    const totalPayments =
        cash +
        card +
        other;


    const totalExpenses =
        salary +
        supplier1 +
        supplier2 +
        supplier3 +
        supplier4 +
        withdraw;


    const html = `

        <div class="report-header">

            <div class="report-logo">
                A5
            </div>

            <div class="report-title">
                ОТЧЁТ СМЕНЫ БАРИСТА
            </div>

            </div>

        </div>


        <!-- ОТКРЫТИЕ -->

            <div class="report-section-title">
                ОТКРЫТИЕ СМЕНЫ
            </div>


            <table class="report-table">

                <tr>

                    <td>
                        Бариста
                    </td>

                    <td colspan="2">
                        <strong>${barista}</strong>
                    </td>

                </tr>


                <tr>

                    <td>
                        Время открытия
                    </td>

                    <td colspan="2">
                        ${openTime}
                    </td>

                </tr>


                <tr>

                    <td>
                        Остаток наличных в кассе
                    </td>

                    <td colspan="2">
                        ${money(openCash)}
                    </td>

                </tr>

            </table>

        </div>


        <!-- ОПЛАТЫ -->

        <div class="report-section">

            <div class="report-section-title">
                ОПЛАТЫ ЗА СМЕНУ
            </div>


            <table class="report-table">

                <tr>

                    <th>
                        Тип оплаты
                    </th>

                    <th>
                        Сумма
                    </th>

                    <th>
                        Комментарий
                    </th>

                </tr>


                <tr>

                    <td>
                        Наличные
                    </td>

                    <td>
                        ${money(cash)}
                    </td>

                    <td>
                        ${value('cashComment')}
                    </td>

                </tr>


                <tr>

                    <td>
                        Безнал (карта / QR)
                    </td>

                    <td>
                        ${money(card)}
                    </td>

                    <td>
                        ${value('cardComment')}
                    </td>

                </tr>


                <tr>

                    <td>
                        Прочее
                    </td>

                    <td>
                        ${money(other)}
                    </td>

                    <td>
                        ${value('otherComment')}
                    </td>

                </tr>


                <tr class="report-total">

                    <td>
                        ИТОГО
                    </td>

                        ${money(totalPayments)}
                    </td>

                    <td></td>

        <div class="report-section">

            <div class="report-section-title">
                РАСХОДЫ И ИЗЪЯТИЯ
            </div>


            <table class="report-table">

                <tr>

        <!-- ЗАКРЫТИЕ -->

        behavior: 'smooth'
    });

/* =========================
   JPEG
========================= */

async function createJPEG() {


    createReport();


    await new Promise(
        resolve => setTimeout(resolve, 400)
    );


    const report =
        document.getElementById('report');


    const canvas =
        await html2canvas(
            report,
            {
                scale: 2,
                backgroundColor: '#ffffff',
                useCORS: true
            }
        );


    canvas.toBlob(

        function(blob) {


            if (!blob) {

                alert(
                    'Не удалось создать JPEG'
                );

                return;
            }


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement('a');


            const date =
                value('date') ||
                'report';


            const barista =
                value('barista') ||
                '';


            link.href =
                url;


            link.download =
                'A5_Отчёт_' +
                date +
                '_' +
                barista +
                '.jpg';


            document.body.appendChild(link);


            link.click();


            document.body.removeChild(link);


            setTimeout(
                function() {

                    URL.revokeObjectURL(url);

                },
                1000
            );


        },

        'image/jpeg',

        0.95

    );

}


/* =========================
   АВТОПЕРЕСЧЁТ
========================= */

document
    .querySelectorAll(
        'input, select'
    )
    .forEach(
        function(element) {

            element.addEventListener(
                'input',
                calculate
            );

            element.addEventListener(
                'change',
                calculate
            );

        }
    );


/* =========================

========================= */

const now =
    new Date();


const year =
    now.getFullYear();


const month =
    String(
        now.getMonth() + 1
    ).padStart(2, '0');


const day =
    String(
        now.getDate()
    ).padStart(2, '0');


document.getElementById(
    'date'
).value =
    year +
    '-' +
    month +
    '-' +
    day;


/* =========================
   ТЕКУЩЕЕ ВРЕМЯ
========================= */

const hours =
    String(
        now.getHours()
    ).padStart(2, '0');


const minutes =
    String(
        now.getMinutes()
    ).padStart(2, '0');


document.getElementById(
    'openTime'
).value =
    hours +
    ':' +
    minutes;


/* =========================
   ПЕРВЫЙ РАСЧЁТ
========================= */

calculate();

</script>

</body>
</html>
