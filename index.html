<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>A5 — Отчёт смены бариста</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
}

body {
    background: #111;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    padding: 8px;
}

.container {
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
}


/* =========================
   ШАПКА ФОРМЫ
========================= */

.header {
    text-align: center;
    margin-bottom: 10px;
}

.logo {
    font-size: 29px;
    font-weight: 700;
    letter-spacing: 4px;
}

.title {
    font-size: 18px;
    font-weight: 600;
    text-transform: uppercase;
    margin-top: 3px;
}


/* =========================
   БЛОКИ ФОРМЫ
========================= */

.card {
    width: 100%;
    background: #1c1c1c;
    border: 1px solid #444;
    border-radius: 8px;
    padding: 9px;
    margin-bottom: 8px;
    overflow: hidden;
}

.section-title {
    font-size: 15px;
    font-weight: 700;
    text-transform: uppercase;
    border-bottom: 1px solid #555;
    padding-bottom: 5px;
    margin-bottom: 7px;
}

.grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 7px;
}

.field {
    min-width: 0;
    display: flex;
    flex-direction: column;
}

label {
    color: #aaa;
    font-size: 11px;
    margin-bottom: 3px;
    white-space: normal;
}

input,
select {
    display: block;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    height: 36px;

    border-radius: 6px;
    border: 1px solid #555;

    background: #292929;
    color: white;

    padding: 5px 7px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;

    outline: none;
}

input:focus,
select:focus {
    border-color: #aaa;
}


/* =========================
   ТАБЛИЦЫ ФОРМЫ
========================= */

.table {
    width: 100%;
    max-width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

.table th,
.table td {
    min-width: 0;
    padding: 4px 2px;
    border-bottom: 1px solid #444;
    overflow: hidden;
}

.table th {
    color: #aaa;
    font-size: 10px;
    font-weight: 600;
    text-align: left;
}

/* Тип */
.table th:nth-child(1) {
    width: 29%;
}

/* Сумма */
.table th:nth-child(2) {
    width: 24%;
}

/* Комментарий */
.table th:nth-child(3) {
    width: 47%;
}

.table td:first-child {
    font-size: 14px;
    line-height: 1.15;
    overflow-wrap: anywhere;
}

.table input {
    width: 100%;
    min-width: 0;
    max-width: 100%;
    height: 33px;
    padding: 4px 5px;
    font-size: 13px;
}

.table input::placeholder {
    color: #999;
    opacity: 1;
}

.total-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding-top: 6px;

    font-size: 15px;
    font-weight: 700;
}

.total-row span:last-child {
    white-space: nowrap;
}


/* =========================
   КНОПКИ
========================= */

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 9px;
}

button {
    width: 100%;
    min-width: 0;
    height: 46px;

    border: 0;
    border-radius: 7px;

    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: 700;

    cursor: pointer;
}

.btn-report {
    background: white;
    color: #111;
}

.btn-jpeg {
    background: #555;
    color: white;
}


/* =========================
   ГОТОВЫЙ ОТЧЁТ
   ОСТАЁТСЯ КРУПНЫМ
========================= */

.report-wrapper {
    display: none;
    width: 100%;
    margin-top: 15px;
}

#report {
    width: 100%;
    background: white;
    color: #111;

    padding: 20px;

    font-family: Arial, Helvetica, sans-serif;
}


/* Шапка */

.report-header {
    text-align: center;
    margin-bottom: 14px;
}

.report-logo {
    font-size: 54px;
    font-weight: 700;
    letter-spacing: 5px;
}

.report-title {
    font-size: 29px;
    font-weight: 500;
    text-transform: uppercase;
    margin-top: 3px;
}

.report-date {
    text-align: left;
    font-size: 22px;
    font-weight: 500;
    margin-top: 12px;
}


/* Секции */

.report-section {
    margin-top: 10px;
}

.report-section-title {
    background: #181818;
    color: white;

    font-size: 23px;
    font-weight: 500;

    padding: 8px 10px;

    text-transform: uppercase;
}


/* Таблица отчёта */

.report-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;

    font-size: 18px;
}

.report-table th,
.report-table td {
    border: 1px solid #333;

    padding: 7px 9px;

    vertical-align: middle;

    overflow-wrap: anywhere;
}

.report-table th {
    background: #ededed;
    font-weight: 600;
    text-align: left;
}

.report-table th:nth-child(1) {
    width: 31%;
}

.report-table th:nth-child(2) {
    width: 25%;
}

.report-table th:nth-child(3) {
    width: 44%;
}

.report-table td:nth-child(2) {
    font-weight: 500;
}

.report-total {
    font-weight: 600;
    background: #ededed;
}


/* =========================
   IPHONE / ANDROID
========================= */

@media (max-width: 500px) {

    body {
        padding: 6px;
    }

    .header {
        margin-bottom: 8px;
    }

    .logo {
        font-size: 27px;
    }

    .title {
        font-size: 17px;
    }

    .card {
        padding: 7px;
        margin-bottom: 7px;
    }

    .section-title {
        font-size: 14px;
        padding-bottom: 5px;
        margin-bottom: 6px;
    }

    .grid {
        gap: 6px;
    }

    label {
        font-size: 10px;
    }

    input,
    select {
        height: 35px;
        font-size: 14px;
    }

    .table th {
        font-size: 9px;
    }

    .table td:first-child {
        font-size: 13px;
    }

    .table input {
        height: 32px;
        font-size: 12px;
        padding: 3px 4px;
    }

    .total-row {
        font-size: 14px;
    }

    .buttons {
        grid-template-columns: 1fr;
    }


    /*
       Сам отчёт НЕ уменьшаем.
       Он остаётся крупным.
    */

    #report {
        padding: 14px;
    }

    .report-logo {
        font-size: 42px;
    }

    .report-title {
        font-size: 21px;
    }

    .report-date {
        font-size: 18px;
    }

    .report-section-title {
        font-size: 18px;
        padding: 7px;
    }

    .report-table {
        font-size: 14px;
    }

    .report-table th,
    .report-table td {
        padding: 5px;
    }
}

</style>
</head>


<body>

<div class="container">


<!-- =========================

========================= -->

<div class="header">

    </div>

    </div>

</div>


<!-- =========================

<div class="card">

                </td>

            </tr>


            <tr>

                <td>
                    Безнал (карта / QR)
                </td>

                <td>

                    <input
                        type="number"
                        id="cardPayments"
                        value="0"
                        inputmode="decimal"
                    >

                </td>

                <td>

                    <input
                        type="text"
                        id="cardComment"
                        placeholder="Комментарий"
                    >

                </td>

            </tr>


            <tr>

                <td>
                    Прочее
                </td>

                <td>

                    <input
                        type="number"
                        id="otherPayments"

                        inputmode="decimal"
                    >

                </td>

                <td>

                    <input
                        type="text"

                </td>

            </tr>


        </tbody>

    </table>


    <div class="total-row">

        <span>
            ИТОГО
        </span>

        <span id="totalPayments">
            0 ₽
        </span>

    </div>

</div>


<!-- =========================
     РАСХОДЫ
========================= -->

<div class="card">

    <div class="section-title">
        Расходы и изъятия
    </div>


    <table class="table">

        <thead>

            <tr>

                <th>
                    Тип
                </th>

                <th>
                    Сумма
                </th>

                <th>
                    Комментарий
                </th>

        <tbody>


            <tr>

                <td>
                    Бариста

                <td>

                    <input
                        type="number"
                        id="salary"

                    >

                <td>

            </tr>

                </td>

                <td>

                        id="supplier1Comment"
                        placeholder="Комментарий"
                    >

                </td>

            </tr>


            <tr>

                <td>
                    Поставщик 2
                </td>

                <td>

                    <input
                        type="number"

                        inputmode="decimal"

                <td>

                    <input
                        type="text"
                        id="supplier2Comment"

                </td>

            </tr>


            <tr>

                <td>
                    Поставщик 3
                </td>

                <td>

                    <input
                        type="number"
                        id="supplier3"
                        value="0"
                        inputmode="decimal"
                    >

                </td>

                <td>

                    <input
                        type="text"
                        id="supplier3Comment"
                        placeholder="Комментарий"
                    >

                </td>

            </tr>


            <tr>

                <td>
                    Поставщик 4
                </td>

                <td>

                    <input
                        type="number"
                        id="supplier4"
                        value="0"
                        inputmode="decimal"
                    >

                </td>

                <td>

                    <input
                        type="text"
                        id="supplier4Comment"
                        placeholder="Комментарий"
                    >

                </td>

            </tr>


            <tr>

                <td>
                    Изъятие

                    <input

                    >

        </tbody>

    </table>


    <div class="total-row">

        <span>
            ИТОГО РАСХОДОВ
        </span>

        <span id="totalExpenses">
            0 ₽
        </span>

    </div>

</div>


<!-- =========================
     ЗАКРЫТИЕ
========================= -->

<div class="card">

    <div class="section-title">
        Закрытие смены

    <div class="grid">

        <div class="field">

                Время
            </label>

            <input
                type="time"
                id="closeTime"

        <div class="field">

            <label>
                Фактический остаток наличных

            <input
                type="number"
                id="closeCash"
                value="0"

            >

</div>


<!-- =========================
     КНОПКИ

<div class="buttons">

    <button
        class="btn-report"

    </button>

        onclick="saveJPEG()"
    >
        Сохранить / отправить JPEG
    </button>

</div>


<!-- =========================
     ГОТОВЫЙ ОТЧЁТ
========================= -->

    class="report-wrapper"
    id="reportWrapper"
>

</div>

<script>


/* =========================
   ФУНКЦИИ
========================= */

function number(id) {

    const value =
        parseFloat(
            document.getElementById(id).value
        );

    return isNaN(value)
        ? 0
        : value;
}


function value(id) {

    return document
        .getElementById(id)
        .value || '';
}


function money(numberValue) {

    return Number(numberValue)
        .toLocaleString('ru-RU') + ' ₽';
}


/* =========================
   РАСЧЁТ
========================= */

function calculate() {

    const cash =
        number('cashPayments');

    const card =
        number('cardPayments');

    const other =
        number('otherPayments');


    const salary =
        number('salary');

    const supplier1 =
        number('supplier1');

    const supplier2 =
        number('supplier2');

    const supplier3 =
        number('supplier3');

    const supplier4 =
        number('supplier4');

    const withdraw =
        number('withdraw');


    const totalPayments =
        cash +
        card +
        other;


    const totalExpenses =
        salary +
        supplier1 +
        supplier2 +
        supplier3 +
        supplier4 +
        withdraw;


    document.getElementById(
        'totalPayments'
    ).textContent =
        money(totalPayments);


    document.getElementById(
        'totalExpenses'
    ).textContent =
        money(totalExpenses);
}


/* =========================
   СОЗДАНИЕ ОТЧЁТА
========================= */

function createReport() {

    calculate();


    const date =
        value('date');

    const barista =
        value('barista');


    const openTime =
        value('openTime');

    const openCash =
        number('openCash');


    const closeTime =
        value('closeTime');

    const closeCash =
        number('closeCash');


    const cash =
        number('cashPayments');

    const card =
        number('cardPayments');

    const other =
        number('otherPayments');


    const salary =
        number('salary');

    const supplier1 =
        number('supplier1');

    const supplier2 =
        number('supplier2');

    const supplier3 =
        number('supplier3');

    const supplier4 =
        number('supplier4');

    const withdraw =
        number('withdraw');


    const totalPayments =
        cash +
        card +
        other;


    const totalExpenses =
        salary +
        supplier1 +
        supplier2 +
        supplier3 +
        supplier4 +
        withdraw;


    const html = `

        <div class="report-header">

            <div class="report-logo">
                A5
            </div>

            <div class="report-title">
                ОТЧЁТ СМЕНЫ БАРИСТА
            </div>

            <div class="report-date">
                Дата: ${date}
            </div>

        </div>


        <!-- ОТКРЫТИЕ -->

        <div class="report-section">

            <div class="report-section-title">
                ОТКРЫТИЕ СМЕНЫ
            </div>

            <table class="report-table">

                <tr>

                    <td>
                        Бариста
                    </td>

                    <td colspan="2">
                        <strong>${barista}</strong>
                    </td>

                </tr>

                <tr>

                    <td>
                        Время открытия
                    </td>

                    <td colspan="2">
                        ${openTime}
                    </td>

                </tr>

                <tr>

                    <td>
                        Остаток наличных в кассе
                    </td>

                    <td colspan="2">
                        ${money(openCash)}
                    </td>

                </tr>

            </table>

        </div>


        <!-- ОПЛАТЫ -->

        <div class="report-section">

            <div class="report-section-title">
                ОПЛАТЫ ЗА СМЕНУ
            </div>

            <table class="report-table">

                <tr>

                    <th>
                        Тип оплаты
                    </th>

                    <th>
                        Сумма
                    </th>

                    <th>
                        Комментарий
                    </th>

                </tr>


                <tr>

                    <td>
                        Наличные
                    </td>

                    <td>
                        ${money(cash)}
                    </td>

                    <td>
                        ${value('cashComment')}
                    </td>

                </tr>


                <tr>

                    <td>
                        Безнал (карта / QR)
                    </td>

                    <td>
                        ${money(card)}
                    </td>

                    <td>
                        ${value('cardComment')}
                    </td>

                </tr>


                <tr>

                    <td>
                        Прочее
                    </td>

                    <td>
                        ${money(other)}
                    </td>

                    <td>
                        ${value('otherComment')}
                    </td>

                </tr>


                <tr class="report-total">

                    <td>
                        ИТОГО
                    </td>

                    <td>
                        ${money(totalPayments)}
                    </td>

                    <td></td>

                </tr>

            </table>

        </div>


        <!-- РАСХОДЫ -->

        <div class="report-section">

            <div class="report-section-title">
                РАСХОДЫ И ИЗЪЯТИЯ
            </div>


            <table class="report-table">

                <tr>

                    <th>
                        Тип
                    </th>

                    <th>
                        Сумма
                    </th>

                    <th>
                        Комментарий
                    </th>

                </tr>


                <tr>

                    <td>
                        Бариста
                    </td>

                    <td>
                        ${money(salary)}
                    </td>

                    <td>
                        ${value('salaryComment')}
                    </td>

                </tr>


                <tr>

                    <td>
                        Поставщик 1
                    </td>

                    <td>
                        ${money(supplier1)}
                    </td>

                    <td>
                        ${value('supplier1Comment')}
                    </td>

                </tr>


                <tr>

                    <td>
                        Поставщик 2
                    </td>

                    <td>
                        ${money(supplier2)}
                    </td>

                    <td>
                        ${value('supplier2Comment')}
                    </td>

                </tr>


                <tr>

                    <td>
                        Поставщик 3
                    </td>

                    <td>
                        ${money(supplier3)}
                    </td>

                    <td>
                        ${value('supplier3Comment')}
                    </td>

                </tr>


                <tr>

                    <td>
                        Поставщик 4
                    </td>

                    <td>
                        ${money(supplier4)}
                    </td>

                    <td>
                        ${value('supplier4Comment')}
                    </td>

                </tr>


                <tr>

                    <td>
                        Изъятие
                    </td>

                    <td>
                        ${money(withdraw)}
                    </td>

                    <td>
                        ${value('withdrawComment')}
                    </td>

                </tr>


                <tr class="report-total">

                    <td>
                        ИТОГО РАСХОДОВ
                    </td>

                    <td>
                        ${money(totalExpenses)}
                    </td>

                    <td></td>

                </tr>

            </table>

        </div>


        <!-- ЗАКРЫТИЕ -->

        <div class="report-section">

            <div class="report-section-title">
                ЗАКРЫТИЕ СМЕНЫ
            </div>


            <table class="report-table">

                <tr>

                    <td>
                        Время закрытия
                    </td>

                    <td colspan="2">
                        ${closeTime}
                    </td>

                </tr>


                <tr>

                    <td>
                        Фактический остаток наличных
                    </td>

                    <td colspan="2">
                        ${money(closeCash)}
                    </td>

                </tr>

            </table>

        </div>

    `;


    document.getElementById(
        'report'
    ).innerHTML = html;


    document.getElementById(
        'reportWrapper'
    ).style.display = 'block';


    document.getElementById(
        'reportWrapper'
    ).scrollIntoView({
        behavior: 'smooth'
    });

}


/* =========================
   СОЗДАНИЕ JPEG
========================= */

async function makeJPEG() {

    createReport();

    await new Promise(
        resolve => setTimeout(resolve, 500)
    );


    const report =
        document.getElementById('report');


    const canvas =
        await html2canvas(
            report,
            {
                scale: 2,
                backgroundColor: '#ffffff',
                useCORS: true
            }
        );


    return new Promise(
        resolve => {

            canvas.toBlob(
                function(blob) {

                    resolve(blob);

                },
                'image/jpeg',
                0.95
            );

        }
    );
}


/* =========================
   СОХРАНИТЬ / ПОДЕЛИТЬСЯ
========================= */

async function saveJPEG() {

    try {

        const blob =
            await makeJPEG();


        if (!blob) {

            alert(
                'Не удалось создать JPEG.'
            );

            return;
        }


        const date =
            value('date') ||
            'report';


        const barista =
            value('barista') ||
            '';


        const filename =
            'A5_Отчёт_' +
            date +
            '_' +
            barista +
            '.jpg';


        /*
           Современные iPhone и Android:
           открываем системное меню «Поделиться».
        */

        const file =
            new File(
                [blob],
                filename,
                {
                    type: 'image/jpeg'
                }
            );


        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({
                files: [file]
            })
        ) {

            await navigator.share({

                files: [file],

                title:
                    'Отчёт смены A5'

            });

            return;
        }


        /*
           Если устройство не поддерживает
           передачу файла через Share API —
           обычное скачивание.
        */

        const url =
            URL.createObjectURL(blob);


        const link =
            document.createElement('a');


        link.href =
            url;


        link.download =
            filename;


        link.style.display =
            'none';


        document.body.appendChild(link);


        link.click();


        document.body.removeChild(link);


        setTimeout(
            function() {

                URL.revokeObjectURL(url);

            },
            2000
        );


    }

    catch (error) {

        /*
           Если пользователь просто закрыл
           меню «Поделиться», ничего не делаем.
        */

        if (
            error &&
            error.name === 'AbortError'
        ) {

            return;

        }


        alert(
            'JPEG создан, но устройство не поддержало прямое сохранение. Попробуйте ещё раз.'
        );

    }

}

========================= */

    new Date();

    now.getFullYear();


const month =
    String(
        now.getMonth() + 1
    ).padStart(2, '0');


const day =
    String(
        now.getDate()
    ).padStart(2, '0');


document.getElementById(
    'date'
).value =
    year +
    '-' +
    month +
    '-' +
    day;


/* =========================
   ВРЕМЯ
========================= */

const hours =
    String(
        now.getHours()
    ).padStart(2, '0');


const minutes =
    String(
        now.getMinutes()
    ).padStart(2, '0');


document.getElementById(
    'openTime'
).value =
    hours +
    ':' +
    minutes;


/* =========================

========================= */
